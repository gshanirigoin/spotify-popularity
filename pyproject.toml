[project]
name = "spotify"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gshan Irigoin", email = "gshan.irigoin@pucp.pe" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
]

[project.scripts]
spotify = "spotify:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
